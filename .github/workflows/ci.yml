name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install dependencies
        run: pip install -q ruff

      - name: Lint with ruff
        run: cd apps/api && ruff check app/

  type-check:
    name: Type Check (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install dependencies
        run: cd apps/api && pip install -q -r requirements.txt

      - name: Type check with pyright
        run: |
          pip install -q pyright
          cd apps/api && pyright app/ --outputjson > /tmp/pyright.json || true
          cat /tmp/pyright.json

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden
          POSTGRES_DB: warden
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install dependencies
        run: cd apps/api && pip install -q -r requirements.txt

      - name: Run alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://warden:warden@localhost:5432/warden
        run: alembic upgrade head

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+psycopg://warden:warden@localhost:5432/warden
        run: cd apps/api && python -m pytest tests/ -v --tb=short

  build-frontend:
    name: Build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd apps/web && npm install

      - name: Type check TypeScript
        run: cd apps/web && npx tsc --noEmit || true

      - name: Build
        run: cd apps/web && npm run build
